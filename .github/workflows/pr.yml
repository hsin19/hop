name: Pull Request

# Everything a PR gets: the shared gate in check.yml, plus the policy that only
# makes sense on a PR -- dependency review and the Dependabot auto-merge. Not
# named `ci.yml` because CI is not what distinguishes it: deploy.yml calls the
# same gate. The trigger is what distinguishes it.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  # Merges a green Dependabot PR with a dedicated PAT (Dependabot secret, NOT the
  # default GITHUB_TOKEN) so the resulting push to main still triggers deploy.yml.
  # See .github/workflows/README.md for the token setup. The deploy-actions group
  # (dependabot.yml) is excluded: wrangler-action only ever runs on a push to main,
  # so a green PR proves nothing about it -- a bad bump would land straight in the
  # production deploy. It gets a human look instead.
  auto-merge:
    name: Auto-merge Dependabot
    needs: [check, dependency-review]
    if: ${{ success() && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.head_ref, 'deploy-actions') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Squash-merge the PR
        run: gh pr merge --squash --delete-branch --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
